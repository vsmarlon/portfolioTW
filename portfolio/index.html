<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Marlon Vargas | Desenvolvedor Full Stack</title>
  <meta name="description" content="Portfólio de Marlon Vargas, desenvolvedor full stack: React, Flutter, NestJS, PostgreSQL e Oracle, com arquitetura e decisões documentadas." />
  <meta name="keywords" content="desenvolvedor, full stack, react, flutter, nestjs, postgresql, oracle, portfolio" />
  <meta name="author" content="Marlon Vargas" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://marlonvargas.dev/" />
  <meta property="og:title" content="Marlon Vargas | Desenvolvedor Full Stack" />
  <meta property="og:description" content="Portfólio de Marlon Vargas, desenvolvedor full stack: React, Flutter, NestJS, PostgreSQL e Oracle, com arquitetura e decisões documentadas." />
  <meta property="og:image" content="/chat.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://marlonvargas.dev/" />
  <meta property="twitter:title" content="Marlon Vargas | Desenvolvedor Full Stack" />
  <meta property="twitter:description" content="Portfólio de Marlon Vargas, desenvolvedor full stack: React, Flutter, NestJS, PostgreSQL e Oracle, com arquitetura e decisões documentadas." />
  <meta property="twitter:image" content="/chat.jpg" />
  
  <!-- Theme Color -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ef" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131110" />
  <meta name="color-scheme" content="dark light" />
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Marlon Vargas" />
  
  <!-- Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="/oi.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/oi.ico" />
  
  <!-- Theme Script - Prevent Flash -->
  <script>
    (function() {
      let stored = null;
      let locale = 'pt-BR';
      try {
        stored = localStorage.getItem('theme');
        const storedLocale = localStorage.getItem('locale');
        if (storedLocale === 'en' || storedLocale === 'pt-BR') locale = storedLocale;
      } catch (_) {}
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.lang = locale;
      document.title = locale === 'en' ? 'Marlon Vargas | Full Stack Developer' : 'Marlon Vargas | Desenvolvedor Full Stack';
    })();
  </script>
</head>
<body class="min-h-screen bg-gray-900 text-white overflow-x-hidden">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
